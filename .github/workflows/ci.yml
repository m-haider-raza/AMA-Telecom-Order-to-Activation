name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts/Deploy_Isolated.py scripts/Verify_Isolated.py scripts/*Foundry*.py
      - run: pytest -q
      - name: Check console sign-in and capacity behavior
        run: node --test tests/console_ui.test.cjs
      - name: Check every front-end script
        run: |
          for script in app/static/*.js; do
            node --check "$script"
          done
      - run: node --check scripts/film3d/scene.js
      - run: node --check scripts/film3d/clarity.js
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/isolated.bicep --stdout > /dev/null
