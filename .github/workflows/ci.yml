name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/static/analytics.js
      - run: node --check app/static/live-demo.js
      - run: node --check app/static/journey.js
      - run: node --check app/static/solution.js
      - run: node --check app/static/orchestration-theme.js
      - run: node --check app/static/tower-crisp-theme.js
      - run: node --check scripts/film3d/scene.js
      - run: node --check app/static/film3d.js
      - run: node --check scripts/film3d/clarity.js
      - run: node --check app/static/film-clarity.js
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
