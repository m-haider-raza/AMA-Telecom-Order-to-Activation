<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c4202f">
  <meta name="robots" content="noindex">
  <title>Partner portal · TürkBizTel</title>
  <link rel="icon" href="/static/turkbiztel-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/account.css?v=tb1">
  <script src="/static/ui.js?v=tb1" defer></script>
  <script src="/static/partner.js?v=tb1" defer></script>
</head>
<body class="account-page partner-page booting">
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" id="logo" href="#deliveries"><img src="/static/turkbiztel-mark.svg" alt="" width="36" height="36">TürkBizTel<span class="pill">Partners</span></a>
      <nav class="nav" aria-label="Partner portal">
        <a href="#deliveries" data-nav="deliveries">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/turkbiztel-icons.svg#truck"/></svg>
          <span>Deliveries</span>
          <span class="count" id="badge-deliveries" hidden></span>
        </a>
        <a href="#payments" data-nav="payments">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/turkbiztel-icons.svg#credit-card"/></svg>
          <span>Payments</span>
          <span class="count" id="badge-payments" hidden></span>
        </a>
        <a href="#concerns" data-nav="concerns">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/turkbiztel-icons.svg#message"/></svg>
          <span>Concerns</span>
          <span class="count" id="badge-concerns" hidden></span>
        </a>
        <a href="#account" data-nav="account">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/turkbiztel-icons.svg#user"/></svg>
          <span>Account</span>
        </a>
      </nav>
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who-text">
          <span id="who-name"></span>
          <span class="who-org" id="who-org"></span>
        </span>
        <button class="btn ghost small" id="signout" type="button" aria-label="Sign out">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/turkbiztel-icons.svg#log-out"/></svg>
          <span>Sign out</span>
        </button>
      </div>
    </div>
  </header>

  <div class="conn" id="connection" role="status" hidden>We can't reach TürkBizTel right now. We'll keep trying, and what you see may be out of date.</div>

  <main class="view" id="view" tabindex="-1">
    <p class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading your deliveries…</p>
    <noscript><p class="loading">TürkBizTel needs JavaScript to show your deliveries. Please turn it on and reload this page.</p></noscript>
  </main>

  <footer class="foot"><span class="live-dot" aria-hidden="true"></span>Updates appear here automatically. No need to refresh.</footer>
  <div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
