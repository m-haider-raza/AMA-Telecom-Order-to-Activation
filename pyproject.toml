[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ama-telecom-activation"
version = "1.0.0"
description = "Synthetic Turkish B2B telecom order-to-activation demonstrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn[standard]>=0.34,<1",
  "azure-identity>=1.21,<2",
  "msal>=1.31,<2",
  "azure-storage-blob>=12.25,<13",
  "httpx>=0.28,<1",
  "azure-communication-email>=1.0,<2",
  "mssql-python>=1.17,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mcp>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
